name: VoltarisOS Tests

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DATABASE_URL: sqlite:///./ci_test.db
      ENVIRONMENT: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile VPP router
        run: python -m py_compile backend/routers/vpp.py

      - name: Run full test suite (backend, forecasting, optimization, simulation, control, gateway)
        run: python -m pytest -q backend forecasting optimization simulation control gateway

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Run isolated industrial flexibility experiment
        run: python -m simulation.scenarios.industrial_flex_isolation > artifacts/industrial_flex_isolation.txt

      - name: Generate economic report
        run: python -m simulation.economic_report

      - name: Generate peak cost reoptimization
        run: python -m simulation.peak_cost_reoptimization

      - name: Upload economic report
        uses: actions/upload-artifact@v4
        with:
          name: economic-report
          path: artifacts/economic_report.json
          if-no-files-found: error

      - name: Upload industrial flexibility experiment
        uses: actions/upload-artifact@v4
        with:
          name: industrial-flex-isolation
          path: artifacts/industrial_flex_isolation.txt
          if-no-files-found: error

      - name: Upload peak cost reoptimization
        uses: actions/upload-artifact@v4
        with:
          name: peak-cost-reoptimization
          path: artifacts/peak_cost_reoptimization.json
          if-no-files-found: error

  # Builds the exact image Railway deploys and smoke-tests it. The test job above
  # runs against a dev install, so it cannot notice a package that is missing
  # from the production image (as happened with sentry-sdk, reportlab, asyncua and
  # the pango libraries weasyprint needs).
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t voltaris:ci .

      - name: Smoke test the image
        run: |
          docker run -i --rm \
            -e ENVIRONMENT=development -e SECRET_KEY=ci-only-secret-key-not-for-production \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            voltaris:ci python - <<'PY'
          import sentry_sdk, reportlab, asyncua, slowapi, openai, pymodbus, pulp, celery
          from weasyprint import HTML  # needs the pango system libraries
          HTML(string="<h1>ok</h1>").write_pdf("/tmp/ci.pdf")
          from pulp import LpStatus  # PuLP 4 removed it
          import backend.main  # the app must import with the production requirements
          print("image smoke test ok")
          PY
